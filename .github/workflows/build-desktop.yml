name: Build Desktop App

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify desktop changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          ref = os.environ['GITHUB_REF']
          build = True
          if os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch' and not (ref.startswith('refs/tags/') or ref.startswith('refs/heads/release/')):
              base = event.get('pull_request', {}).get('base', {}).get('sha') or event.get('before')
              if base and base.strip('0'):
                  paths = subprocess.check_output(['git', 'diff', '--name-only', base, os.environ['GITHUB_SHA']], text=True).splitlines()
                  build = any(not (path.endswith('.md') or path.startswith('docs/')) for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'build={str(build).lower()}\n')
          print('Build required:', build)
          PY

  build:
    name: Build (${{ matrix.platform.name }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.os == 'macos-14' && '14.0' || '' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      ARCH: x86_64
      NO_STRIP: "true"
      GDK_PIXBUF_MODULEDIR: /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders
      GDK_PIXBUF_MODULE_FILE: /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-14
          - name: windows-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "Python executable not found on runner" >&2
            exit 1
          fi
          version="$("$PY" -c 'import pathlib,re,sys; text=pathlib.Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"); section=re.search(r"(?ms)^\[package\]\s*(.*?)(?=^\[|\Z)", text); m=re.search(r"(?m)^\s*version\s*=\s*\"([^\"]+)\"\s*$", section.group(1) if section else ""); print(m.group(1) if m else (sys.stderr.write("Could not find [package].version in src-tauri/Cargo.toml\\n") or sys.exit(1)))')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "App version: ${version}"

      - name: Validate release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          expected="v${{ steps.app_version.outputs.version }}"
          actual="${GITHUB_REF_NAME}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Tag/version mismatch: tag=${actual}, expected=${expected}" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify version consistency
        run: node scripts/version-sync.mjs --check

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.platform.os == 'ubuntu-22.04' && 'ubuntu-22.04-glibc-2.35' || matrix.platform.os }}

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            build-essential \
            python3 \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libgdk-pixbuf2.0-bin \
            squashfs-tools \
            gtk+3.0 \
            libgtk-3-dev \
            librsvg2-common \
            shared-mime-info \
            cmake \
            ninja-build
          sudo /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders --update-cache
          sudo /usr/lib/x86_64-linux-gnu/libgtk3-nocsd.so.0 || true
          sudo gtk-query-immodules-3.0 --update-cache 2>/dev/null || true
          sudo update-mime-database /usr/share/mime 2>/dev/null || true

      - name: Normalize Linux pkg-config metadata
        if: matrix.platform.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          overlay_dir="${RUNNER_TEMP}/pkgconfig"
          mkdir -p "${overlay_dir}"

          pc_path="$(dpkg -L librsvg2-dev | awk '/\/librsvg-2\.0\.pc$/ { print; exit }')"
          if [[ -z "${pc_path}" ]]; then
            echo "Could not locate librsvg-2.0.pc from librsvg2-dev" >&2
            exit 1
          fi
          cp "${pc_path}" "${overlay_dir}/librsvg-2.0.pc"

          if [[ -z "$(PKG_CONFIG_PATH="${overlay_dir}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" pkg-config --variable=libdir librsvg-2.0)" ]]; then
            multiarch="$(gcc -print-multiarch)"
            {
              echo
              echo "libdir=/usr/lib/${multiarch}"
            } >> "${overlay_dir}/librsvg-2.0.pc"
          fi

          echo "PKG_CONFIG_PATH=${overlay_dir}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "${GITHUB_ENV}"
          pkg-config --modversion librsvg-2.0
          PKG_CONFIG_PATH="${overlay_dir}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" pkg-config --variable=libdir librsvg-2.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend types
        working-directory: frontend
        run: npm run check

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Stage bundled third-party notices
        shell: bash
        run: |
          set -euo pipefail
          cp THIRD_PARTY_NOTICES.md src-tauri/resources/THIRD_PARTY_NOTICES.md
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            mkdir -p src-tauri/resources/licenses
            cp /usr/share/common-licenses/GPL-3 src-tauri/resources/licenses/GPL-3.txt
            cp /usr/share/doc/libgomp1/copyright src-tauri/resources/licenses/libgomp1-copyright.txt
          fi
          python -m unittest discover -s scripts/tests -v

      - name: Verify bundled espeak-ng on the release baseline
        if: matrix.platform.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/src-tauri/resources/espeak-ng/bin/espeak-ng"
          data="$GITHUB_WORKSPACE/src-tauri/resources/espeak-ng/share/espeak-ng-data"
          test -x "$binary"
          output="$(ESPEAK_DATA_PATH="$data" "$binary" -q --ipa -v en-us "Hello world.")"
          test -n "$output"
          echo "espeak-ng baseline check: $output"

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features tauri-runtime

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Resolve runtime versions
        id: runtime_versions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # v1.9.4 ships no upstream binary assets, so the server is
          # built from this pinned source tag below. Bump deliberately
          # and re-validate voice input before changing.
          whisper_tag="v1.9.4"
          echo "whisper_tag=${whisper_tag}" >> "${GITHUB_OUTPUT}"
          libgomp_version="none"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            libgomp_version="$(dpkg-query -W -f='${Version}' libgomp1)"
          fi
          echo "libgomp_version=${libgomp_version}" >> "${GITHUB_OUTPUT}"
          # Clear any git-tracked foreign-OS whisper binary before cache restore
          rm -f src-tauri/resources/whisper-server/whisper-server-*
          echo "Cache key: whisper=${whisper_tag} libgomp=${libgomp_version}"

      - name: Restore cached Whisper runtime and verified models
        id: cache_whisper
        uses: actions/cache/restore@v4
        with:
          path: |
            src-tauri/resources/whisper-server
            src-tauri/resources/whisper
          key: whisper-closure-v13-portable-${{ matrix.platform.os }}-${{ runner.arch }}-${{ steps.runtime_versions.outputs.whisper_tag }}-${{ steps.runtime_versions.outputs.libgomp_version }}-${{ hashFiles('scripts/model_assets.py', 'src-tauri/resources/whisper/ggml-base-q8_0.bin') }}

      - name: Prune non-bundled Whisper models
        shell: bash
        run: |
          set -euo pipefail
          models_dir="src-tauri/resources/whisper"
          keep="ggml-base-q8_0.bin"
          test -f "$models_dir/$keep"
          find "$models_dir" -maxdepth 1 -type f ! -name "$keep" -delete
          echo "Bundled Whisper models: $(find "$models_dir" -maxdepth 1 -type f -printf '%f ' | sort)"

      - name: Build bundled whisper runtimes from pinned source
        if: steps.cache_whisper.outputs.cache-hit != 'true'
        shell: bash
        env:
          WHISPER_TAG: ${{ steps.runtime_versions.outputs.whisper_tag }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/whisper.cpp"
          build_dir="$RUNNER_TEMP/whisper-build"
          resources_root="$GITHUB_WORKSPACE/src-tauri/resources"
          whisper_server_dir="$resources_root/whisper-server"
          whisper_models_dir="$resources_root/whisper"
          rm -rf "$source_dir" "$build_dir" "$whisper_server_dir"
          mkdir -p "$whisper_server_dir" "$whisper_models_dir"

          case "$RUNNER_OS/$RUNNER_ARCH" in
            "Linux/X64") target_name="whisper-server-linux-x86_64" ;;
            "Windows/X64") target_name="whisper-server-windows-x86_64.exe" ;;
            "macOS/ARM64") target_name="whisper-server-macos-aarch64" ;;
            "macOS/X64") target_name="whisper-server-macos-x86_64" ;;
            *)
              echo "[whisper-runtime] Unsupported runner: $RUNNER_OS/$RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          binary_name="whisper-server"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary_name="whisper-server.exe"; fi

          echo "[whisper-runtime] cloning ${WHISPER_TAG}"
          git clone --depth 1 --branch "$WHISPER_TAG" https://github.com/ggerganov/whisper.cpp.git "$source_dir"
          echo "[whisper-runtime] configuring"
          cmake -S "$source_dir" -B "$build_dir" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          python scripts/verify_runtime_bundle.py --cmake-cache "$build_dir/CMakeCache.txt"
          echo "[whisper-runtime] building whisper-server"
          cmake --build "$build_dir" --config Release --target whisper-server --parallel

          server="$(find "$build_dir" -type f -name "$binary_name" | head -1)"
          if [[ -z "$server" ]]; then
            echo "[whisper-runtime] ERROR: ${binary_name} not found under ${build_dir}" >&2
            find "$build_dir" -maxdepth 4 -type f | head -40 >&2
            exit 1
          fi

          # Complete runtime dependency closure, matching the app's expected
          # per-platform binary name (see src-tauri/src/stt/supervisor.rs).
          cp "$server" "$whisper_server_dir/$target_name"
          find "$build_dir" \( -type f -o -type l \) \( \
            -name '*.so' -o -name '*.so.*' -o -name '*.dylib' -o -name '*.dll' \
          \) -exec cp -L {} "$whisper_server_dir"/ \;
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            libgomp="$(LD_LIBRARY_PATH="$build_dir/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd "$server" \
              | awk '$1 == "libgomp.so.1" && $2 == "=>" { print $3; exit }')"
            if [[ -z "$libgomp" || ! -f "$libgomp" ]]; then
              echo "[whisper-runtime] ERROR: libgomp.so.1 dependency was not found" >&2
              ldd "$server" >&2
              exit 1
            fi
            cp -L "$libgomp" "$whisper_server_dir/libgomp.so.1"
          fi
          if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "$whisper_server_dir/$target_name"; fi

          echo "[whisper-runtime] smoke test ${target_name}"
          if ! "$whisper_server_dir/$target_name" --help > /dev/null 2>&1; then
            echo "[whisper-runtime] ERROR: ${target_name} failed the --help smoke test" >&2
            exit 1
          fi

          WHISPER_TAG="$WHISPER_TAG" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
          TARGET_NAME="$target_name" python - <<'PY_MANIFEST'
          import json
          import os
          import pathlib
          import subprocess

          server_dir = pathlib.Path("src-tauri/resources/whisper-server")
          binary = server_dir / os.environ["TARGET_NAME"]
          if not binary.is_file():
              raise SystemExit(f"Missing bundled whisper server: {binary}")
          support_files = sorted(
              entry.name
              for entry in server_dir.iterdir()
              if entry.is_file() and entry.name != os.environ["TARGET_NAME"]
          )
          manifest = {
              "releaseTag": os.environ["WHISPER_TAG"],
              "runnerOs": os.environ["RUNNER_OS"],
              "runnerArch": os.environ["RUNNER_ARCH"],
              "status": "ready",
              "binaryPath": str(binary),
              "supportFiles": support_files,
              "source": "https://github.com/ggerganov/whisper.cpp",
              "ggmlNative": False,
              "libgompPackageVersion": subprocess.check_output(
                  ["dpkg-query", "-W", "-f=${Version}", "libgomp1"], text=True
              ).strip() if os.environ["RUNNER_OS"] == "Linux" else None,
          }
          (server_dir / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print("[whisper-runtime] manifest written")
          PY_MANIFEST

          echo "[whisper-runtime] final resources:"
          ls -la "$whisper_server_dir" "$whisper_models_dir"

      - name: Verify portable runtime cache policy and closures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_runtime_bundle.py --runtime whisper \
            --root src-tauri/resources/whisper-server --platform "$RUNNER_OS" \
            --tag '${{ steps.runtime_versions.outputs.whisper_tag }}'

      - name: Verify real staged Whisper closure
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$RUNNER_ARCH" in
            "Linux/X64") target_name="whisper-server-linux-x86_64" ;;
            "Windows/X64") target_name="whisper-server-windows-x86_64.exe" ;;
            "macOS/ARM64") target_name="whisper-server-macos-aarch64" ;;
            "macOS/X64") target_name="whisper-server-macos-x86_64" ;;
            *) echo "Unsupported runner: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          binary="$GITHUB_WORKSPACE/src-tauri/resources/whisper-server/$target_name"
          test -f "$binary"
          ARXELL_TEST_WHISPER_BINARY="$binary" cargo test --manifest-path src-tauri/Cargo.toml --features tauri-runtime real_whisper_runs_from_staged_closure -- --ignored

      - name: Save verified Whisper closure before packaging
        if: steps.cache_whisper.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src-tauri/resources/whisper-server
            src-tauri/resources/whisper
          key: ${{ steps.cache_whisper.outputs.cache-primary-key }}

      - name: Build Tauri app bundle
        working-directory: src-tauri
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          set -euo pipefail
          mkdir -p "${XDG_CACHE_HOME}"
          # Frontend verification/build already ran above; don't repeat a hook
          # whose cwd varies across CLI versions (frontend/frontend locally).
          rm -rf target/release/bundle
          case "${{ matrix.platform.os }}" in
            ubuntu-22.04)
              ../frontend/node_modules/.bin/tauri build --config '{"build":{"beforeBuildCommand":""}}' --bundles deb -- --features tauri-runtime 2>&1
              runtime_library_path="$GITHUB_WORKSPACE/src-tauri/resources/whisper-server"
              DEBUG=1 LD_LIBRARY_PATH="$runtime_library_path" ../frontend/node_modules/.bin/tauri build --config '{"build":{"beforeBuildCommand":""}}' --verbose --bundles appimage -- --features tauri-runtime 2>&1
              ;;
            windows-latest)
              ../frontend/node_modules/.bin/tauri build --config '{"build":{"beforeBuildCommand":""}}' --bundles msi -- --features tauri-runtime
              ;;
            macos-14)
              ../frontend/node_modules/.bin/tauri build --config '{"build":{"beforeBuildCommand":""}}' --bundles dmg -- --features tauri-runtime
              ;;
            *)
              echo "Unsupported platform: ${{ matrix.platform.os }}" >&2
              exit 1
              ;;
          esac

      - name: Verify Linux artifacts
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)

          [ -f "$DEB" ]      || { echo "ERROR: .deb not found";      exit 1; }
          [ -f "$APPIMAGE" ] || { echo "ERROR: .AppImage not found"; exit 1; }

          echo "deb:      $(du -h "$DEB"      | cut -f1)  $DEB"
          echo "AppImage: $(du -h "$APPIMAGE" | cut -f1)  $APPIMAGE"

          find src-tauri/target/release/bundle/appimage \
            -type d -name "*.AppDir" -exec rm -rf {} + 2>/dev/null || true

          SIZE=$(stat -c%s "$APPIMAGE")
          [ "$SIZE" -gt 10485760 ] || { echo "ERROR: AppImage is ${SIZE} bytes — likely a partial build"; exit 1; }

      - name: Install and launch Linux packages in clean Ubuntu 22.04
        if: matrix.platform.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          mkdir -p "$RUNNER_TEMP/acceptance"
          chmod 777 "$RUNNER_TEMP/acceptance"
          # Separate containers: installing the deb must not hide missing
          # AppImage dependencies, and the deb container must pull its own
          # declared runtime dependencies via apt rather than pre-installing them.
          for package in deb appimage; do
            docker run --rm -e PACKAGE="$package" \
              -v "$GITHUB_WORKSPACE/$DEB:/tmp/arxell.deb:ro" \
              -v "$GITHUB_WORKSPACE/$APPIMAGE:/tmp/Arxell.AppImage:ro" \
              -v "$GITHUB_WORKSPACE/scripts:/test-scripts:ro" \
              -v "$RUNNER_TEMP/acceptance:/evidence" \
              ubuntu:22.04 bash -euc '
                trap "chmod -R a+rX /evidence 2>/dev/null || true" EXIT
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ca-certificates python3 xvfb xauth dbus-x11
                useradd --create-home tester
                if [ "$PACKAGE" = deb ]; then
                  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /tmp/arxell.deb
                  resources=/usr/lib/Arxell/resources
                  binary=/usr/bin/arxell
                else
                  DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libfuse2 libwebkit2gtk-4.1-0 libasound2
                  mkdir /tmp/extracted
                  cd /tmp/extracted
                  APPIMAGE_EXTRACT_AND_RUN=1 /tmp/Arxell.AppImage --appimage-extract >/dev/null
                  chmod -R a+rX /tmp/extracted
                  cd /tmp
                  resources=/tmp/extracted/squashfs-root/usr/lib/Arxell/resources
                  binary=/tmp/Arxell.AppImage
                fi
                test -s "$resources/THIRD_PARTY_NOTICES.md"
                grep -q "GNU OpenMP" "$resources/THIRD_PARTY_NOTICES.md"
                test -s "$resources/licenses/GPL-3.txt"
                grep -q "GCC RUNTIME LIBRARY EXCEPTION" "$resources/licenses/libgomp1-copyright.txt"
                runuser -u tester -- python3 /test-scripts/packaged_runtime_smoke.py "$resources" --output "/evidence/$PACKAGE-runtimes"
                runuser -u tester -- dbus-run-session -- xvfb-run -a python3 /test-scripts/desktop_launch_smoke.py --output "/evidence/$PACKAGE-launch" -- "$binary"
              '
          done

      - name: Verify Tauri bundle output
        shell: bash
        env:
          PLATFORM_OS: ${{ matrix.platform.os }}
        run: |
          set -euo pipefail
          test -d src-tauri/target/release/bundle
          python - <<'PY'
          import os
          import pathlib

          platform_os = os.environ["PLATFORM_OS"]
          expected_suffixes = {
              "ubuntu-22.04": {".deb", ".appimage"},
              "windows-latest": {".msi"},
              "macos-14": {".dmg"},
          }.get(platform_os)
          if expected_suffixes is None:
              raise SystemExit(f"Unsupported platform: {platform_os}")

          files = [p for p in pathlib.Path("src-tauri/target/release/bundle").rglob("*") if p.is_file()]
          package_files = [p for p in files if p.suffix.lower() in expected_suffixes]
          if not package_files:
            raise SystemExit("No final Tauri package files were produced")
          for path in package_files:
            print(f"{path} ({path.stat().st_size} bytes)")

          produced_suffixes = {p.suffix.lower() for p in package_files}
          missing_suffixes = expected_suffixes - produced_suffixes
          if missing_suffixes:
              raise SystemExit(
                  f"Missing required bundle output for {platform_os}: "
                  f"{sorted(missing_suffixes)}"
              )
          PY

      - name: Install, launch, and uninstall Windows MSI
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI artifact was not produced' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "MSI install failed with exit code $($install.ExitCode)" }
          $exeCandidates = @(
            "$env:LOCALAPPDATA\Arxell\Arxell.exe",
            "$env:LOCALAPPDATA\Programs\Arxell\Arxell.exe",
            "$env:ProgramFiles\Arxell\Arxell.exe",
            "${env:ProgramFiles(x86)}\Arxell\Arxell.exe"
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exePath) { throw 'Installed Arxell.exe was not found in the standard MSI install locations' }
          $app = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) { throw "Installed app exited during startup (code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed with exit code $($uninstall.ExitCode)" }

      - name: Mount and validate macOS DMG installation
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/release/bundle -name '*.dmg' | head -1)
          mount_dir="$RUNNER_TEMP/arxell-dmg"
          app_copy="$RUNNER_TEMP/Arxell.app"
          mkdir -p "$mount_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
          cleanup() { hdiutil detach "$mount_dir" -quiet || true; }
          trap cleanup EXIT
          app=$(find "$mount_dir" -maxdepth 2 -name 'Arxell.app' -print -quit)
          test -n "$app"
          ditto "$app" "$app_copy"
          plutil -lint "$app_copy/Contents/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_copy/Contents/Info.plist")
          test -x "$app_copy/Contents/MacOS/$executable"
          file "$app_copy/Contents/MacOS/$executable" | grep -q 'arm64'
          # Remove build-tree libraries so copied bundle checks cannot resolve
          # dependencies accidentally from the compiler workspace.
          rm -rf "$RUNNER_TEMP/whisper-build"
          python scripts/desktop_launch_smoke.py --output "$RUNNER_TEMP/acceptance/macos-installed" -- "$app_copy/Contents/MacOS/$executable"
          resources=$(find "$app_copy/Contents/Resources" -type d -name whisper-server -print -quit)
          test -n "$resources"
          resources_root="$(dirname "$resources")"
          test -s "$resources_root/THIRD_PARTY_NOTICES.md"
          python scripts/packaged_runtime_smoke.py "$resources_root" --output "$RUNNER_TEMP/acceptance/macos-runtimes"
          echo "Launched copied Apple Silicon app and tested packaged runtime closure"

      - name: Build CI-only renderer IPC probe (never bundle or publish)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-smoke --bin arxell desktop_smoke::tests
          cargo build --manifest-path src-tauri/Cargo.toml --release --features desktop-smoke

      - name: Require renderer and real Rust IPC handshake
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/src-tauri/target/release/arxell"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y xvfb xauth dbus-x11
            dbus-run-session -- xvfb-run -a python scripts/desktop_launch_smoke.py --require-report --output "$RUNNER_TEMP/acceptance/renderer-ipc" -- "$binary"
          else
            python scripts/desktop_launch_smoke.py --require-report --output "$RUNNER_TEMP/acceptance/renderer-ipc" -- "$binary"
          fi

      - name: Upload acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-acceptance-evidence
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: ignore

      - name: Upload Tauri bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-tauri-bundle
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

      - name: Upload bundled whisper manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-whisper-runtime-manifest
          path: src-tauri/resources/whisper-server/manifest.json
          if-no-files-found: warn

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-release-assets
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          fi
          version="$("$PY" -c 'import pathlib,re,sys; text=pathlib.Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"); section=re.search(r"(?ms)^\[package\]\s*(.*?)(?=^\[|\Z)", text); m=re.search(r"(?m)^\s*version\s*=\s*\"([^\"]+)\"\s*$", section.group(1) if section else ""); print(m.group(1) if m else (sys.stderr.write("Could not find [package].version in src-tauri/Cargo.toml\\n") or sys.exit(1)))')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Download release bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release-assets"
          merge-multiple: true
          path: release-assets

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_checksums.py release-assets > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          body_path: docs/RELEASE_NOTES_v${{ steps.app_version.outputs.version }}.md
          files: |
            release-assets/**/*.deb
            release-assets/**/*.AppImage
            release-assets/**/*.dmg
            release-assets/**/*.msi
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: true
