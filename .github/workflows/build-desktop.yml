name: Build Desktop App

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      ARCH: x86_64
      NO_STRIP: "true"
      GDK_PIXBUF_MODULEDIR: /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders
      GDK_PIXBUF_MODULE_FILE: /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-latest
          - name: windows-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "Python executable not found on runner" >&2
            exit 1
          fi
          version="$("$PY" -c 'import pathlib,re,sys; text=pathlib.Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"); section=re.search(r"(?ms)^\[package\]\s*(.*?)(?=^\[|\Z)", text); m=re.search(r"(?m)^\s*version\s*=\s*\"([^\"]+)\"\s*$", section.group(1) if section else ""); print(m.group(1) if m else (sys.stderr.write("Could not find [package].version in src-tauri/Cargo.toml\\n") or sys.exit(1)))')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "App version: ${version}"

      - name: Validate release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          expected="v${{ steps.app_version.outputs.version }}"
          actual="${GITHUB_REF_NAME}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Tag/version mismatch: tag=${actual}, expected=${expected}" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify version consistency
        run: node scripts/version-sync.mjs --check

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Tauri CLI
        id: cache_tauri_cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-v2

      - name: Install Tauri CLI
        if: steps.cache_tauri_cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version "^2.0.0"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.platform.os == 'ubuntu-22.04' && 'ubuntu-22.04-glibc-2.35' || matrix.platform.os }}

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            build-essential \
            python3 \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libgdk-pixbuf2.0-bin \
            squashfs-tools \
            gtk+3.0 \
            libgtk-3-dev \
            librsvg2-common \
            shared-mime-info \
            cmake \
            ninja-build \
            libvulkan-dev \
            spirv-headers
          sudo /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders --update-cache
          sudo /usr/lib/x86_64-linux-gnu/libgtk3-nocsd.so.0 || true
          sudo gtk-query-immodules-3.0 --update-cache 2>/dev/null || true
          sudo update-mime-database /usr/share/mime 2>/dev/null || true

      - name: Normalize Linux pkg-config metadata
        if: matrix.platform.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          overlay_dir="${RUNNER_TEMP}/pkgconfig"
          mkdir -p "${overlay_dir}"

          pc_path="$(dpkg -L librsvg2-dev | awk '/\/librsvg-2\.0\.pc$/ { print; exit }')"
          if [[ -z "${pc_path}" ]]; then
            echo "Could not locate librsvg-2.0.pc from librsvg2-dev" >&2
            exit 1
          fi
          cp "${pc_path}" "${overlay_dir}/librsvg-2.0.pc"

          if [[ -z "$(PKG_CONFIG_PATH="${overlay_dir}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" pkg-config --variable=libdir librsvg-2.0)" ]]; then
            multiarch="$(gcc -print-multiarch)"
            {
              echo
              echo "libdir=/usr/lib/${multiarch}"
            } >> "${overlay_dir}/librsvg-2.0.pc"
          fi

          echo "PKG_CONFIG_PATH=${overlay_dir}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "${GITHUB_ENV}"
          pkg-config --modversion librsvg-2.0
          PKG_CONFIG_PATH="${overlay_dir}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" pkg-config --variable=libdir librsvg-2.0

      - name: Install Vulkan SDK for Windows llama.cpp build
        if: matrix.platform.os == 'windows-latest'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend types
        working-directory: frontend
        run: npm run check

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Stage bundled third-party notices
        shell: bash
        run: |
          set -euo pipefail
          cp THIRD_PARTY_NOTICES.md src-tauri/resources/THIRD_PARTY_NOTICES.md
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            mkdir -p src-tauri/resources/licenses
            cp /usr/share/common-licenses/GPL-3 src-tauri/resources/licenses/GPL-3.txt
            cp /usr/share/doc/libgomp1/copyright src-tauri/resources/licenses/libgomp1-copyright.txt
          fi
          python -m unittest discover -s scripts/tests -v

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features tauri-runtime

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Resolve runtime versions
        id: runtime_versions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # v0.4.1 is the latest stable llama.cpp release and ships no upstream
          # binary assets, so engines are built from this pinned source tag
          # below. Bump deliberately and re-validate inference before changing.
          llama_tag="v0.4.1"
          # v1.9.4 ships no upstream binary assets, so the server is
          # built from this pinned source tag below. Bump deliberately
          # and re-validate voice input before changing.
          whisper_tag="v1.9.4"
          shaderc_tag="v2023.8"
          vulkan_headers_tag="vulkan-sdk-1.4.309.0"
          kokoro_hash="$(md5sum scripts/prepare_kokoro_runtime.py scripts/verify_kokoro_runtime_archive.py | md5sum | cut -d' ' -f1)"
          echo "llama_tag=${llama_tag}" >> "${GITHUB_OUTPUT}"
          echo "whisper_tag=${whisper_tag}" >> "${GITHUB_OUTPUT}"
          echo "shaderc_tag=${shaderc_tag}" >> "${GITHUB_OUTPUT}"
          echo "vulkan_headers_tag=${vulkan_headers_tag}" >> "${GITHUB_OUTPUT}"
          echo "kokoro_hash=${kokoro_hash}" >> "${GITHUB_OUTPUT}"
          libgomp_version="none"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            libgomp_version="$(dpkg-query -W -f='${Version}' libgomp1)"
          fi
          echo "libgomp_version=${libgomp_version}" >> "${GITHUB_OUTPUT}"
          echo "Cache key: llama=${llama_tag} whisper=${whisper_tag} shaderc=${shaderc_tag} vulkan_headers=${vulkan_headers_tag} kokoro=${kokoro_hash}"

      - name: Cache bundled runtimes
        id: cache_runtimes
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/llama-runtime
            src-tauri/resources/whisper-server
            src-tauri/resources/whisper
            src-tauri/resources/kokoro-runtime
          # Do not restore pre-policy/native-tuned caches, even when source tags match.
          key: runtimes-llama-source-v11-portable-all-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime_versions.outputs.llama_tag }}-${{ steps.runtime_versions.outputs.whisper_tag }}-${{ steps.runtime_versions.outputs.shaderc_tag }}-${{ steps.runtime_versions.outputs.vulkan_headers_tag }}-${{ steps.runtime_versions.outputs.libgomp_version }}-${{ steps.runtime_versions.outputs.kokoro_hash }}

      - name: Build and install pinned SPIRV-Headers for Windows
        if: matrix.platform.os == 'windows-latest' && steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/SPIRV-Headers"
          build_dir="$RUNNER_TEMP/spirv-headers-build"
          install_dir="$RUNNER_TEMP/spirv-headers-install"
          # Match the Vulkan SDK version above. The SDK action supplies Vulkan
          # itself but not the SPIRV-Headers CMake package required by llama.cpp.
          git clone --depth 1 --branch vulkan-sdk-1.4.309.0 \
            https://github.com/KhronosGroup/SPIRV-Headers.git "$source_dir"
          cmake -S "$source_dir" -B "$build_dir" \
            -DSPIRV_HEADERS_ENABLE_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$install_dir"
          cmake --build "$build_dir" --config Release --target install
          test -f "$install_dir/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake"
          echo "Installed SPIRV-Headers package: $install_dir"

      - name: Build and install pinned Vulkan headers for Linux
        if: matrix.platform.os == 'ubuntu-22.04' && steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        env:
          VULKAN_HEADERS_TAG: ${{ steps.runtime_versions.outputs.vulkan_headers_tag }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/Vulkan-Headers"
          build_dir="$RUNNER_TEMP/vulkan-headers-build"
          install_dir="$RUNNER_TEMP/vulkan-headers-install"
          git clone --depth 1 --branch "$VULKAN_HEADERS_TAG" \
            https://github.com/KhronosGroup/Vulkan-Headers.git "$source_dir"
          cmake -S "$source_dir" -B "$build_dir" \
            -DCMAKE_INSTALL_PREFIX="$install_dir"
          cmake --build "$build_dir" --target install --parallel "$(nproc)"
          test -f "$install_dir/include/vulkan/vulkan.h"
          echo "Installed Vulkan headers $VULKAN_HEADERS_TAG: $install_dir"

      - name: Build pinned glslc for Linux Vulkan runtime
        if: matrix.platform.os == 'ubuntu-22.04' && steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        env:
          SHADERC_TAG: ${{ steps.runtime_versions.outputs.shaderc_tag }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/shaderc"
          build_dir="$RUNNER_TEMP/shaderc-build"
          bin_dir="$RUNNER_TEMP/shaderc-bin"
          rm -rf "$source_dir" "$build_dir" "$bin_dir"
          git clone --depth 1 --branch "$SHADERC_TAG" \
            https://github.com/google/shaderc.git "$source_dir"
          python3 "$source_dir/utils/git-sync-deps"
          cmake -S "$source_dir" -B "$build_dir" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$build_dir" --target glslc_exe --parallel "$(nproc)"
          glslc_binary="$(find "$build_dir" -type f -name glslc -executable | head -1)"
          test -n "$glslc_binary" && test -x "$glslc_binary"
          mkdir -p "$bin_dir"
          install -m 755 "$glslc_binary" "$bin_dir/glslc"
          if ldd "$bin_dir/glslc" | grep -q 'not found'; then
            ldd "$bin_dir/glslc" >&2
            echo "Pinned glslc has unresolved runtime libraries" >&2
            exit 1
          fi
          "$bin_dir/glslc" --version
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Build bundled llama.cpp runtimes from pinned source
        if: steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        env:
          LLAMA_TAG: ${{ steps.runtime_versions.outputs.llama_tag }}
        run: |
          set -euo pipefail
          # Make the SDK Vulkan loader visible to the engine smoke test.
          if [[ -n "${VULKAN_SDK:-}" && -d "${VULKAN_SDK}" ]]; then
            export PATH="$VULKAN_SDK/Bin:$VULKAN_SDK/RunTimes/x64:$VULKAN_SDK/Runtime/x64:$PATH"
          fi
          source_dir="$RUNNER_TEMP/llama.cpp"
          resources_dir="$GITHUB_WORKSPACE/src-tauri/resources/llama-runtime"
          rm -rf "$source_dir" "$resources_dir"
          echo "[llama-runtime] cloning ${LLAMA_TAG}"
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp.git "$source_dir"
          mkdir -p "$resources_dir"

          build_engine() {
            local engine_id="$1"
            shift
            local build_dir="$RUNNER_TEMP/llama-build-${engine_id}"
            local binary_name="llama-server"
            if [[ "$RUNNER_OS" == "Windows" ]]; then binary_name="llama-server.exe"; fi
            echo "[llama-runtime] configuring ${engine_id}"
            # Keep release binaries portable across CPUs; never use runner-native ISA tuning.
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              cmake -S "$source_dir" -B "$build_dir" \
                -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON -DGGML_NATIVE=OFF \
                "-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/spirv-headers-install" "$@"
            elif [[ "$RUNNER_OS" == "Linux" ]]; then
              cmake -S "$source_dir" -B "$build_dir" \
                -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON -DGGML_NATIVE=OFF \
                "-DVulkan_INCLUDE_DIR=$RUNNER_TEMP/vulkan-headers-install/include" "$@"
            else
              cmake -S "$source_dir" -B "$build_dir" \
                -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON -DGGML_NATIVE=OFF "$@"
            fi
            python scripts/verify_runtime_bundle.py --cmake-cache "$build_dir/CMakeCache.txt"
            echo "[llama-runtime] building ${engine_id}"
            cmake --build "$build_dir" --config Release --target llama-server --parallel
            local server
            server="$(find "$build_dir" -type f -name "$binary_name" | head -1)"
            if [[ -z "$server" ]]; then
              echo "[llama-runtime] ERROR: ${binary_name} not found under ${build_dir}" >&2
              find "$build_dir" -maxdepth 4 -type f | head -40 >&2
              return 1
            fi
            local engine_dir="$resources_dir/$engine_id"
            mkdir -p "$engine_dir"
            cp "$server" "$engine_dir/$binary_name"
            # Complete runtime dependency closure: shared libraries and Metal
            # kernels when the build does not embed them. GGML_METAL_EMBED_LIBRARY
            # defaults to ON at v0.4.1, so macOS usually has no extra files.
            # Preserve the loader-visible sonames as regular files in the
            # portable bundle: Linux/macOS builds commonly expose them as
            # symlinks to versioned library files, and `-type f` misses those.
            find "$build_dir" \( -type f -o -type l \) \( \
              -name '*.so' -o -name '*.so.*' -o -name '*.dylib' -o -name '*.dll' \
              -o -name '*.metallib' -o -name '*.metal' \
            \) -exec cp -L {} "$engine_dir"/ \;
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              local libgomp
              libgomp="$(LD_LIBRARY_PATH="$build_dir/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd "$server" \
                | awk '$1 == "libgomp.so.1" && $2 == "=>" { print $3; exit }')"
              if [[ -z "$libgomp" || ! -f "$libgomp" ]]; then
                echo "[llama-runtime] ERROR: libgomp.so.1 dependency was not found for ${engine_id}" >&2
                ldd "$server" >&2
                return 1
              fi
              cp -L "$libgomp" "$engine_dir/libgomp.so.1"
            fi
            if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "$engine_dir/$binary_name"; fi
            # Match runtime_service.rs: copied shared libraries live beside
            # the executable and must be discoverable after cache restore.
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              export LD_LIBRARY_PATH="$engine_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            elif [[ "$RUNNER_OS" == "macOS" ]]; then
              export DYLD_LIBRARY_PATH="$engine_dir${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
            fi
            echo "[llama-runtime] smoke test ${engine_id}"
            if ! "$engine_dir/$binary_name" --version; then
              echo "[llama-runtime] ERROR: ${engine_id} failed the --version smoke test" >&2
              return 1
            fi
            echo "[llama-runtime] prepared ${engine_id}:"
            ls -la "$engine_dir"
          }

          case "$RUNNER_OS" in
            Linux)
              build_engine llama.cpp-cpu -DGGML_VULKAN=OFF
              build_engine llama.cpp-vulkan -DGGML_VULKAN=ON
              required_engines='["llama.cpp-cpu", "llama.cpp-vulkan"]'
              ;;
            Windows)
              build_engine llama.cpp-cpu -DGGML_VULKAN=OFF
              build_engine llama.cpp-vulkan -DGGML_VULKAN=ON
              required_engines='["llama.cpp-cpu", "llama.cpp-vulkan"]'
              ;;
            macOS)
              build_engine llama.cpp-cpu -DGGML_METAL=OFF
              build_engine llama.cpp-metal -DGGML_METAL=ON
              required_engines='["llama.cpp-cpu", "llama.cpp-metal"]'
              ;;
            *)
              echo "Unsupported runner: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

          LLAMA_TAG="$LLAMA_TAG" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" REQUIRED_ENGINES="$required_engines" python - <<'PY_MANIFEST'
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path("src-tauri/resources/llama-runtime")
          binary_name = "llama-server.exe" if os.environ["RUNNER_OS"] == "Windows" else "llama-server"
          engines = {}
          for engine_id in json.loads(os.environ["REQUIRED_ENGINES"]):
              engine_dir = root / engine_id
              binary = engine_dir / binary_name
              if not binary.is_file():
                  raise SystemExit(f"Missing bundled runtime: {binary}")
              support_files = sorted(
                  entry.name
                  for entry in engine_dir.iterdir()
                  if entry.is_file() and entry.name != binary_name
              )
              engines[engine_id] = {
                  "binaryPath": str(binary),
                  "source": "built-from-source",
                  "supportFiles": support_files,
              }
          (root / "manifest.json").write_text(
              json.dumps(
                  {
                      "releaseTag": os.environ["LLAMA_TAG"],
                      "runnerOs": os.environ["RUNNER_OS"],
                      "runnerArch": os.environ["RUNNER_ARCH"],
                      "source": "https://github.com/ggml-org/llama.cpp",
                      "ggmlNative": False,
                      "libgompPackageVersion": subprocess.check_output(
                          ["dpkg-query", "-W", "-f=${Version}", "libgomp1"], text=True
                      ).strip() if os.environ["RUNNER_OS"] == "Linux" else None,
                      "engines": engines,
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          print("[llama-runtime] manifest written")
          PY_MANIFEST

      - name: Verify bundled llama.cpp runtimes
        shell: bash
        env:
          LLAMA_TAG: ${{ steps.runtime_versions.outputs.llama_tag }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path("src-tauri/resources/llama-runtime")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected_tag = os.environ["LLAMA_TAG"]
          if manifest.get("releaseTag") != expected_tag:
              raise SystemExit(
                  f"Expected llama.cpp {expected_tag}, got {manifest.get('releaseTag')!r}"
              )
          expected = {
              "Linux": ["llama.cpp-cpu", "llama.cpp-vulkan"],
              "Windows": ["llama.cpp-cpu", "llama.cpp-vulkan"],
              "macOS": ["llama.cpp-cpu", "llama.cpp-metal"],
          }[os.environ["RUNNER_OS"]]
          binary_name = (
              "llama-server.exe" if os.environ["RUNNER_OS"] == "Windows" else "llama-server"
          )
          for engine_id in expected:
              binary = root / engine_id / binary_name
              if not binary.is_file():
                  raise SystemExit(f"Missing bundled runtime: {binary}")
              # Test the relocated runtime closure, not the runner's CMake
              # build-tree RPATH. This is the loader path the app configures
              # when it starts a bundled engine.
              env = os.environ.copy()
              loader_var = {
                  "Linux": "LD_LIBRARY_PATH",
                  "macOS": "DYLD_LIBRARY_PATH",
                  "Windows": "PATH",
              }[os.environ["RUNNER_OS"]]
              prior = env.get(loader_var, "")
              env[loader_var] = str(binary.parent) + (os.pathsep + prior if prior else "")
              result = subprocess.run(
                  [str(binary), "--version"], capture_output=True, text=True, env=env
              )
              if result.returncode != 0:
                  raise SystemExit(
                      f"{binary} --version failed ({result.returncode})\n"
                      f"stdout: {result.stdout[-4000:]}\nstderr: {result.stderr[-4000:]}"
                  )
          print(f"Verified llama.cpp {expected_tag} runtime bundle: {expected}")
          PY

      - name: Build bundled whisper runtimes from pinned source
        if: steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        env:
          WHISPER_TAG: ${{ steps.runtime_versions.outputs.whisper_tag }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/whisper.cpp"
          build_dir="$RUNNER_TEMP/whisper-build"
          resources_root="$GITHUB_WORKSPACE/src-tauri/resources"
          whisper_server_dir="$resources_root/whisper-server"
          whisper_models_dir="$resources_root/whisper"
          rm -rf "$source_dir" "$build_dir" "$whisper_server_dir"
          mkdir -p "$whisper_server_dir" "$whisper_models_dir"

          case "$RUNNER_OS/$RUNNER_ARCH" in
            "Linux/X64") target_name="whisper-server-linux-x86_64" ;;
            "Windows/X64") target_name="whisper-server-windows-x86_64.exe" ;;
            "macOS/ARM64") target_name="whisper-server-macos-aarch64" ;;
            "macOS/X64") target_name="whisper-server-macos-x86_64" ;;
            *)
              echo "[whisper-runtime] Unsupported runner: $RUNNER_OS/$RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          binary_name="whisper-server"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary_name="whisper-server.exe"; fi

          echo "[whisper-runtime] cloning ${WHISPER_TAG}"
          git clone --depth 1 --branch "$WHISPER_TAG" https://github.com/ggerganov/whisper.cpp.git "$source_dir"
          echo "[whisper-runtime] configuring"
          cmake -S "$source_dir" -B "$build_dir" -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          python scripts/verify_runtime_bundle.py --cmake-cache "$build_dir/CMakeCache.txt"
          echo "[whisper-runtime] building whisper-server"
          cmake --build "$build_dir" --config Release --target whisper-server --parallel

          server="$(find "$build_dir" -type f -name "$binary_name" | head -1)"
          if [[ -z "$server" ]]; then
            echo "[whisper-runtime] ERROR: ${binary_name} not found under ${build_dir}" >&2
            find "$build_dir" -maxdepth 4 -type f | head -40 >&2
            exit 1
          fi

          # Complete runtime dependency closure, matching the app's expected
          # per-platform binary name (see src-tauri/src/stt/supervisor.rs).
          cp "$server" "$whisper_server_dir/$target_name"
          find "$build_dir" \( -type f -o -type l \) \( \
            -name '*.so' -o -name '*.so.*' -o -name '*.dylib' -o -name '*.dll' \
          \) -exec cp -L {} "$whisper_server_dir"/ \;
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            libgomp="$(LD_LIBRARY_PATH="$build_dir/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd "$server" \
              | awk '$1 == "libgomp.so.1" && $2 == "=>" { print $3; exit }')"
            if [[ -z "$libgomp" || ! -f "$libgomp" ]]; then
              echo "[whisper-runtime] ERROR: libgomp.so.1 dependency was not found" >&2
              ldd "$server" >&2
              exit 1
            fi
            cp -L "$libgomp" "$whisper_server_dir/libgomp.so.1"
          fi
          if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "$whisper_server_dir/$target_name"; fi

          echo "[whisper-runtime] smoke test ${target_name}"
          if ! "$whisper_server_dir/$target_name" --help > /dev/null 2>&1; then
            echo "[whisper-runtime] ERROR: ${target_name} failed the --help smoke test" >&2
            exit 1
          fi

          # A release claiming bundled voice must include verified models.
          # Download errors are fatal, never cached as a silently degraded bundle.
          python scripts/model_assets.py whisper "$whisper_models_dir"

          WHISPER_TAG="$WHISPER_TAG" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
          TARGET_NAME="$target_name" python - <<'PY_MANIFEST'
          import json
          import os
          import pathlib
          import subprocess

          server_dir = pathlib.Path("src-tauri/resources/whisper-server")
          binary = server_dir / os.environ["TARGET_NAME"]
          if not binary.is_file():
              raise SystemExit(f"Missing bundled whisper server: {binary}")
          support_files = sorted(
              entry.name
              for entry in server_dir.iterdir()
              if entry.is_file() and entry.name != os.environ["TARGET_NAME"]
          )
          manifest = {
              "releaseTag": os.environ["WHISPER_TAG"],
              "runnerOs": os.environ["RUNNER_OS"],
              "runnerArch": os.environ["RUNNER_ARCH"],
              "status": "ready",
              "binaryPath": str(binary),
              "supportFiles": support_files,
              "source": "https://github.com/ggerganov/whisper.cpp",
              "ggmlNative": False,
              "libgompPackageVersion": subprocess.check_output(
                  ["dpkg-query", "-W", "-f=${Version}", "libgomp1"], text=True
              ).strip() if os.environ["RUNNER_OS"] == "Linux" else None,
          }
          (server_dir / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print("[whisper-runtime] manifest written")
          PY_MANIFEST

          echo "[whisper-runtime] final resources:"
          ls -la "$whisper_server_dir" "$whisper_models_dir"

      - name: Prepare bundled Kokoro runtime archive
        if: steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "Python executable not found on runner" >&2
            exit 1
          fi
          "$PY" scripts/prepare_kokoro_runtime.py

      - name: Verify bundled Kokoro runtime archive
        if: steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "Python executable not found on runner" >&2
            exit 1
          fi
          "$PY" scripts/verify_kokoro_runtime_archive.py

      - name: Generate Kokoro runtime manifest
        if: steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "Python executable not found on runner" >&2
            exit 1
          fi
          "$PY" - <<'PY'
          import hashlib
          import json
          import pathlib
          import platform

          def expected_archive_name() -> str:
            system = platform.system().lower()
            machine = platform.machine().lower()
            if machine in {"amd64", "x86_64", "x64"}:
              arch = "x86_64"
            elif machine in {"arm64", "aarch64"}:
              arch = "aarch64"
            else:
              raise RuntimeError(f"Unsupported architecture: {machine}")

            if system == "linux":
              os_tag = "linux"
            elif system == "darwin":
              os_tag = "macos"
            elif system == "windows":
              os_tag = "windows"
            else:
              raise RuntimeError(f"Unsupported platform: {system}")
            return f"kokoro-runtime-{os_tag}-{arch}.zip"

          repo_root = pathlib.Path(".").resolve()
          runtime_dir = repo_root / "src-tauri" / "resources" / "kokoro-runtime"
          archive = runtime_dir / expected_archive_name()
          if not archive.exists():
            raise RuntimeError(f"Kokoro runtime archive missing: {archive}")

          sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest = {
            "runnerOs": platform.system(),
            "runnerArch": platform.machine(),
            "archiveName": archive.name,
            "archivePath": str(archive.relative_to(repo_root)),
            "archiveSizeBytes": archive.stat().st_size,
            "sha256": sha256,
          }
          (runtime_dir / "manifest.json").write_text(
            json.dumps(manifest, indent=2) + "\n",
            encoding="utf-8",
          )
          print(f"[kokoro-runtime] manifest written for {archive.name}")
          PY

      - name: Verify portable runtime cache policy and closures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_runtime_bundle.py --runtime llama \
            --root src-tauri/resources/llama-runtime --platform "$RUNNER_OS" \
            --tag '${{ steps.runtime_versions.outputs.llama_tag }}'
          python scripts/verify_runtime_bundle.py --runtime whisper \
            --root src-tauri/resources/whisper-server --platform "$RUNNER_OS" \
            --tag '${{ steps.runtime_versions.outputs.whisper_tag }}'

      - name: Build Tauri app bundle
        working-directory: src-tauri
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          set -euo pipefail
          mkdir -p "${XDG_CACHE_HOME}"
          # Frontend verification/build already ran above; don't repeat a hook
          # whose cwd varies across CLI versions (frontend/frontend locally).
          rm -rf target/release/bundle
          case "${{ matrix.platform.os }}" in
            ubuntu-22.04)
              cargo tauri build --config '{"build":{"beforeBuildCommand":""}}' --bundles deb -- --features tauri-runtime 2>&1
              runtime_library_path="$GITHUB_WORKSPACE/src-tauri/resources/llama-runtime/llama.cpp-cpu:$GITHUB_WORKSPACE/src-tauri/resources/llama-runtime/llama.cpp-vulkan:$GITHUB_WORKSPACE/src-tauri/resources/whisper-server"
              DEBUG=1 LD_LIBRARY_PATH="$runtime_library_path" cargo tauri build --config '{"build":{"beforeBuildCommand":""}}' --verbose --bundles appimage -- --features tauri-runtime 2>&1
              ;;
            windows-latest)
              cargo tauri build --config '{"build":{"beforeBuildCommand":""}}' --bundles msi -- --features tauri-runtime
              ;;
            macos-latest)
              cargo tauri build --config '{"build":{"beforeBuildCommand":""}}' --bundles dmg -- --features tauri-runtime
              ;;
            *)
              echo "Unsupported platform: ${{ matrix.platform.os }}" >&2
              exit 1
              ;;
          esac

      - name: Verify Linux artifacts
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)

          [ -f "$DEB" ]      || { echo "ERROR: .deb not found";      exit 1; }
          [ -f "$APPIMAGE" ] || { echo "ERROR: .AppImage not found"; exit 1; }

          echo "deb:      $(du -h "$DEB"      | cut -f1)  $DEB"
          echo "AppImage: $(du -h "$APPIMAGE" | cut -f1)  $APPIMAGE"

          find src-tauri/target/release/bundle/appimage \
            -type d -name "*.AppDir" -exec rm -rf {} + 2>/dev/null || true

          SIZE=$(stat -c%s "$APPIMAGE")
          [ "$SIZE" -gt 10485760 ] || { echo "ERROR: AppImage is ${SIZE} bytes — likely a partial build"; exit 1; }

      - name: Install and launch Linux packages in clean Ubuntu 22.04
        if: matrix.platform.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          docker run --rm \
            -v "$GITHUB_WORKSPACE/$DEB:/tmp/arxell.deb:ro" \
            -v "$GITHUB_WORKSPACE/$APPIMAGE:/tmp/Arxell.AppImage:ro" \
            ubuntu:22.04 bash -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libfuse2 xvfb xauth dbus-x11
              dpkg -i /tmp/arxell.deb || apt-get install -f -y -qq
              mkdir -p /tmp/appimage-extract
              cd /tmp/appimage-extract
              APPIMAGE_EXTRACT_AND_RUN=1 /tmp/Arxell.AppImage --appimage-extract >/dev/null
              appdir=/tmp/appimage-extract/squashfs-root/usr/lib/Arxell/resources
              test -s "$appdir/THIRD_PARTY_NOTICES.md"
              grep -q "GNU OpenMP" "$appdir/THIRD_PARTY_NOTICES.md"
              test -s "$appdir/licenses/GPL-3.txt"
              grep -q "GCC RUNTIME LIBRARY EXCEPTION" "$appdir/licenses/libgomp1-copyright.txt"
              llama_dir="$appdir/llama-runtime/llama.cpp-cpu"
              whisper_dir="$appdir/whisper-server"
              LD_LIBRARY_PATH="$llama_dir" "$llama_dir/llama-server" --version
              LD_LIBRARY_PATH="$whisper_dir" "$whisper_dir/whisper-server-linux-x86_64" --help >/dev/null
              cd /
              smoke_launch() {
                set +e
                timeout --signal=TERM --kill-after=5s 25s xvfb-run -a "$@" >/tmp/arxell-launch.log 2>&1
                result=$?
                set -e
                if [ "$result" -ne 124 ]; then
                  cat /tmp/arxell-launch.log
                  echo "Arxell exited before the clean-machine launch timeout (status $result)" >&2
                  exit 1
                fi
                if grep -Eq "GLIBC_[0-9.]+.*not found|error while loading shared libraries" /tmp/arxell-launch.log; then
                  cat /tmp/arxell-launch.log
                  exit 1
                fi
              }
              smoke_launch /usr/bin/arxell
              smoke_launch env APPIMAGE_EXTRACT_AND_RUN=1 /tmp/Arxell.AppImage
            '

      - name: Verify Tauri bundle output
        shell: bash
        env:
          PLATFORM_OS: ${{ matrix.platform.os }}
        run: |
          set -euo pipefail
          test -d src-tauri/target/release/bundle
          python - <<'PY'
          import os
          import pathlib

          platform_os = os.environ["PLATFORM_OS"]
          expected_suffixes = {
              "ubuntu-22.04": {".deb", ".appimage"},
              "windows-latest": {".msi"},
              "macos-latest": {".dmg"},
          }.get(platform_os)
          if expected_suffixes is None:
              raise SystemExit(f"Unsupported platform: {platform_os}")

          files = [p for p in pathlib.Path("src-tauri/target/release/bundle").rglob("*") if p.is_file()]
          package_files = [p for p in files if p.suffix.lower() in expected_suffixes]
          if not package_files:
            raise SystemExit("No final Tauri package files were produced")
          for path in package_files:
            print(f"{path} ({path.stat().st_size} bytes)")

          produced_suffixes = {p.suffix.lower() for p in package_files}
          missing_suffixes = expected_suffixes - produced_suffixes
          if missing_suffixes:
              raise SystemExit(
                  f"Missing required bundle output for {platform_os}: "
                  f"{sorted(missing_suffixes)}"
              )
          PY

      - name: Install, launch, and uninstall Windows MSI
        if: matrix.platform.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI artifact was not produced' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "MSI install failed with exit code $($install.ExitCode)" }
          $exeCandidates = @(
            "$env:LOCALAPPDATA\Arxell\Arxell.exe",
            "$env:LOCALAPPDATA\Programs\Arxell\Arxell.exe",
            "$env:ProgramFiles\Arxell\Arxell.exe",
            "${env:ProgramFiles(x86)}\Arxell\Arxell.exe"
          )
          $exePath = $exeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exePath) { throw 'Installed Arxell.exe was not found in the standard MSI install locations' }
          $app = Start-Process -FilePath $exePath -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) { throw "Installed app exited during startup (code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $msi.FullName, '/qn', '/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed with exit code $($uninstall.ExitCode)" }

      - name: Mount and validate macOS DMG installation
        if: matrix.platform.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/release/bundle -name '*.dmg' | head -1)
          mount_dir="$RUNNER_TEMP/arxell-dmg"
          app_copy="$RUNNER_TEMP/Arxell.app"
          mkdir -p "$mount_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
          cleanup() { hdiutil detach "$mount_dir" -quiet || true; }
          trap cleanup EXIT
          app=$(find "$mount_dir" -maxdepth 2 -name 'Arxell.app' -print -quit)
          test -n "$app"
          ditto "$app" "$app_copy"
          plutil -lint "$app_copy/Contents/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_copy/Contents/Info.plist")
          test -x "$app_copy/Contents/MacOS/$executable"
          file "$app_copy/Contents/MacOS/$executable" | grep -q 'arm64'
          echo "Validated copied Apple Silicon app bundle: $app_copy"

      - name: Build CI-only renderer IPC probe (never bundle or publish)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-smoke --bin arxell desktop_smoke::tests
          cargo build --manifest-path src-tauri/Cargo.toml --release --features desktop-smoke

      - name: Require renderer and real Rust IPC handshake
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/src-tauri/target/release/arxell"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y xvfb xauth dbus-x11
            dbus-run-session -- xvfb-run -a python scripts/desktop_launch_smoke.py --require-report --output "$RUNNER_TEMP/acceptance/renderer-ipc" -- "$binary"
          else
            python scripts/desktop_launch_smoke.py --require-report --output "$RUNNER_TEMP/acceptance/renderer-ipc" -- "$binary"
          fi

      - name: Upload acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-acceptance-evidence
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: ignore

      - name: Upload Tauri bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-tauri-bundle
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

      - name: Upload bundled runtime manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-llama-runtime-manifest
          path: src-tauri/resources/llama-runtime/manifest.json
          if-no-files-found: error

      - name: Upload bundled whisper manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-whisper-runtime-manifest
          path: src-tauri/resources/whisper-server/manifest.json
          if-no-files-found: warn

      - name: Upload bundled Kokoro runtime manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-kokoro-runtime-manifest
          path: src-tauri/resources/kokoro-runtime/manifest.json
          if-no-files-found: error

      - name: Upload bundled Kokoro runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-kokoro-runtime
          path: src-tauri/resources/kokoro-runtime/kokoro-runtime-*.zip
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-release-assets
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          fi
          version="$("$PY" -c 'import pathlib,re,sys; text=pathlib.Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"); section=re.search(r"(?ms)^\[package\]\s*(.*?)(?=^\[|\Z)", text); m=re.search(r"(?m)^\s*version\s*=\s*\"([^\"]+)\"\s*$", section.group(1) if section else ""); print(m.group(1) if m else (sys.stderr.write("Could not find [package].version in src-tauri/Cargo.toml\\n") or sys.exit(1)))')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Download release bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release-assets"
          merge-multiple: true
          path: release-assets

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_release_checksums.py release-assets > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          body_path: docs/RELEASE_NOTES_v${{ steps.app_version.outputs.version }}.md
          files: |
            release-assets/**/*.deb
            release-assets/**/*.AppImage
            release-assets/**/*.dmg
            release-assets/**/*.msi
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: true
