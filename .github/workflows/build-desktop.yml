name: Build Desktop App

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      ARCH: x86_64
      NO_STRIP: "true"
      GDK_PIXBUF_MODULEDIR: /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders
      GDK_PIXBUF_MODULE_FILE: /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-latest
          - name: windows-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "Python executable not found on runner" >&2
            exit 1
          fi
          version="$("$PY" -c 'import pathlib,re,sys; text=pathlib.Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"); section=re.search(r"(?ms)^\[package\]\s*(.*?)(?=^\[|\Z)", text); m=re.search(r"(?m)^\s*version\s*=\s*\"([^\"]+)\"\s*$", section.group(1) if section else ""); print(m.group(1) if m else (sys.stderr.write("Could not find [package].version in src-tauri/Cargo.toml\\n") or sys.exit(1)))')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "App version: ${version}"

      - name: Validate release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          expected="v${{ steps.app_version.outputs.version }}"
          actual="${GITHUB_REF_NAME}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Tag/version mismatch: tag=${actual}, expected=${expected}" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify version consistency
        run: node scripts/version-sync.mjs --check

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Tauri CLI
        id: cache_tauri_cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-v2

      - name: Install Tauri CLI
        if: steps.cache_tauri_cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version "^2.0.0"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2t64 \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libgdk-pixbuf2.0-bin \
            squashfs-tools \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gtk+3.0 \
            libgtk-3-dev \
            librsvg2-common \
            shared-mime-info \
            cmake \
            ninja-build \
            libvulkan-dev \
            glslc
          sudo /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders --update-cache
          sudo /usr/lib/x86_64-linux-gnu/libgtk3-nocsd.so.0 || true
          sudo gtk-query-immodules-3.0 --update-cache 2>/dev/null || true
          sudo update-mime-database /usr/share/mime 2>/dev/null || true

      - name: Normalize Linux pkg-config metadata
        if: matrix.platform.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          overlay_dir="${RUNNER_TEMP}/pkgconfig"
          mkdir -p "${overlay_dir}"

          pc_path="$(dpkg -L librsvg2-dev | awk '/\/librsvg-2\.0\.pc$/ { print; exit }')"
          if [[ -z "${pc_path}" ]]; then
            echo "Could not locate librsvg-2.0.pc from librsvg2-dev" >&2
            exit 1
          fi
          cp "${pc_path}" "${overlay_dir}/librsvg-2.0.pc"

          if [[ -z "$(PKG_CONFIG_PATH="${overlay_dir}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" pkg-config --variable=libdir librsvg-2.0)" ]]; then
            multiarch="$(gcc -print-multiarch)"
            {
              echo
              echo "libdir=/usr/lib/${multiarch}"
            } >> "${overlay_dir}/librsvg-2.0.pc"
          fi

          echo "PKG_CONFIG_PATH=${overlay_dir}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "${GITHUB_ENV}"
          pkg-config --modversion librsvg-2.0
          PKG_CONFIG_PATH="${overlay_dir}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" pkg-config --variable=libdir librsvg-2.0

      - name: Setup Vulkan SDK for Windows llama.cpp build
        if: matrix.platform.os == 'windows-latest'
        uses: Khrushkin/action-setup-vulkan@v1
        with:
          version: 1.3.275.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend types
        working-directory: frontend
        run: npm run check

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features tauri-runtime

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Resolve runtime versions
        id: runtime_versions
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # v0.4.1 is the latest stable llama.cpp release and ships no upstream
          # binary assets, so engines are built from this pinned source tag
          # below. Bump deliberately and re-validate inference before changing.
          llama_tag="v0.4.1"
          whisper_tag="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" https://api.github.com/repos/ggerganov/whisper.cpp/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          kokoro_hash="$(md5sum scripts/prepare_kokoro_runtime.py scripts/verify_kokoro_runtime_archive.py | md5sum | cut -d' ' -f1)"
          echo "llama_tag=${llama_tag}" >> "${GITHUB_OUTPUT}"
          echo "whisper_tag=${whisper_tag}" >> "${GITHUB_OUTPUT}"
          echo "kokoro_hash=${kokoro_hash}" >> "${GITHUB_OUTPUT}"
          echo "Cache key: llama=${llama_tag} whisper=${whisper_tag} kokoro=${kokoro_hash}"

      - name: Cache bundled runtimes
        id: cache_runtimes
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/llama-runtime
            src-tauri/resources/whisper-server
            src-tauri/resources/whisper
            src-tauri/resources/kokoro-runtime
          key: runtimes-llama-source-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime_versions.outputs.llama_tag }}-${{ steps.runtime_versions.outputs.whisper_tag }}-${{ steps.runtime_versions.outputs.kokoro_hash }}

      - name: Build bundled llama.cpp runtimes from pinned source
        if: steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        env:
          LLAMA_TAG: ${{ steps.runtime_versions.outputs.llama_tag }}
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/llama.cpp"
          resources_dir="$GITHUB_WORKSPACE/src-tauri/resources/llama-runtime"
          rm -rf "$source_dir" "$resources_dir"
          echo "[llama-runtime] cloning ${LLAMA_TAG}"
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp.git "$source_dir"
          mkdir -p "$resources_dir"

          build_engine() {
            local engine_id="$1"
            shift
            local build_dir="$RUNNER_TEMP/llama-build-${engine_id}"
            local binary_name="llama-server"
            if [[ "$RUNNER_OS" == "Windows" ]]; then binary_name="llama-server.exe"; fi
            echo "[llama-runtime] configuring ${engine_id}"
            cmake -S "$source_dir" -B "$build_dir" -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_SERVER=ON "$@"
            echo "[llama-runtime] building ${engine_id}"
            cmake --build "$build_dir" --config Release --parallel
            local server
            server="$(find "$build_dir" -type f -name "$binary_name" | head -1)"
            if [[ -z "$server" ]]; then
              echo "[llama-runtime] ERROR: ${binary_name} not found under ${build_dir}" >&2
              find "$build_dir" -maxdepth 4 -type f | head -40 >&2
              return 1
            fi
            local engine_dir="$resources_dir/$engine_id"
            mkdir -p "$engine_dir"
            cp "$server" "$engine_dir/$binary_name"
            # Complete runtime dependency closure: shared libraries and Metal
            # kernels when the build does not embed them. GGML_METAL_EMBED_LIBRARY
            # defaults to ON at v0.4.1, so macOS usually has no extra files.
            find "$build_dir" -type f \( \
              -name '*.so' -o -name '*.so.*' -o -name '*.dylib' -o -name '*.dll' \
              -o -name '*.metallib' -o -name '*.metal' \
            \) -exec cp {} "$engine_dir"/ \;
            if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "$engine_dir/$binary_name"; fi
            echo "[llama-runtime] smoke test ${engine_id}"
            if ! "$engine_dir/$binary_name" --version; then
              echo "[llama-runtime] ERROR: ${engine_id} failed the --version smoke test" >&2
              return 1
            fi
            echo "[llama-runtime] prepared ${engine_id}:"
            ls -la "$engine_dir"
          }

          case "$RUNNER_OS" in
            Linux)
              build_engine llama.cpp-cpu -DGGML_VULKAN=OFF
              build_engine llama.cpp-vulkan -DGGML_VULKAN=ON
              required_engines='["llama.cpp-cpu", "llama.cpp-vulkan"]'
              ;;
            Windows)
              build_engine llama.cpp-cpu -DGGML_VULKAN=OFF
              build_engine llama.cpp-vulkan -DGGML_VULKAN=ON
              required_engines='["llama.cpp-cpu", "llama.cpp-vulkan"]'
              ;;
            macOS)
              build_engine llama.cpp-cpu -DGGML_METAL=OFF
              build_engine llama.cpp-metal -DGGML_METAL=ON
              required_engines='["llama.cpp-cpu", "llama.cpp-metal"]'
              ;;
            *)
              echo "Unsupported runner: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

          LLAMA_TAG="$LLAMA_TAG" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" REQUIRED_ENGINES="$required_engines" python - <<'PY_MANIFEST'
          import json
          import os
          import pathlib

          root = pathlib.Path("src-tauri/resources/llama-runtime")
          binary_name = "llama-server.exe" if os.environ["RUNNER_OS"] == "Windows" else "llama-server"
          engines = {}
          for engine_id in json.loads(os.environ["REQUIRED_ENGINES"]):
              engine_dir = root / engine_id
              binary = engine_dir / binary_name
              if not binary.is_file():
                  raise SystemExit(f"Missing bundled runtime: {binary}")
              support_files = sorted(
                  entry.name
                  for entry in engine_dir.iterdir()
                  if entry.is_file() and entry.name != binary_name
              )
              engines[engine_id] = {
                  "binaryPath": str(binary),
                  "source": "built-from-source",
                  "supportFiles": support_files,
              }
          (root / "manifest.json").write_text(
              json.dumps(
                  {
                      "releaseTag": os.environ["LLAMA_TAG"],
                      "runnerOs": os.environ["RUNNER_OS"],
                      "runnerArch": os.environ["RUNNER_ARCH"],
                      "source": "https://github.com/ggml-org/llama.cpp",
                      "engines": engines,
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          print("[llama-runtime] manifest written")
          PY_MANIFEST

      - name: Verify bundled llama.cpp runtimes
        shell: bash
        env:
          LLAMA_TAG: ${{ steps.runtime_versions.outputs.llama_tag }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path("src-tauri/resources/llama-runtime")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected_tag = os.environ["LLAMA_TAG"]
          if manifest.get("releaseTag") != expected_tag:
              raise SystemExit(
                  f"Expected llama.cpp {expected_tag}, got {manifest.get('releaseTag')!r}"
              )
          expected = {
              "Linux": ["llama.cpp-cpu", "llama.cpp-vulkan"],
              "Windows": ["llama.cpp-cpu", "llama.cpp-vulkan"],
              "macOS": ["llama.cpp-cpu", "llama.cpp-metal"],
          }[os.environ["RUNNER_OS"]]
          binary_name = (
              "llama-server.exe" if os.environ["RUNNER_OS"] == "Windows" else "llama-server"
          )
          for engine_id in expected:
              binary = root / engine_id / binary_name
              if not binary.is_file():
                  raise SystemExit(f"Missing bundled runtime: {binary}")
              subprocess.run([str(binary), "--version"], check=True, capture_output=True)
          print(f"Verified llama.cpp {expected_tag} runtime bundle: {expected}")
          PY

      - name: Prepare bundled whisper runtimes
        if: steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import stat
          import tarfile
          import urllib.request
          import zipfile

          def request_json(url: str) -> dict:
            req = urllib.request.Request(url)
            req.add_header("Accept", "application/vnd.github+json")
            req.add_header("User-Agent", "arxell-ci")
            token = os.environ.get("GITHUB_TOKEN", "").strip()
            if token:
              req.add_header("Authorization", f"Bearer {token}")
            with urllib.request.urlopen(req, timeout=60) as resp:
              return json.loads(resp.read().decode("utf-8"))

          def safe_extract_tar(archive_path: pathlib.Path, dest: pathlib.Path) -> None:
            with tarfile.open(archive_path, "r:*") as tf:
              for member in tf.getmembers():
                target = (dest / member.name).resolve()
                if not str(target).startswith(str(dest.resolve())):
                  raise RuntimeError(f"unsafe tar member path: {member.name}")
              tf.extractall(dest)

          def download_file(url: str, dest: pathlib.Path) -> bool:
            try:
              req = urllib.request.Request(url, headers={"User-Agent": "arxell-ci"})
              with urllib.request.urlopen(req, timeout=120) as resp, open(dest, "wb") as out:
                shutil.copyfileobj(resp, out)
              return True
            except Exception as e:
              print(f"Download failed: {e}")
              return False

          runner_os = os.environ.get("RUNNER_OS", "")
          os_key = {
            "Linux": "linux",
            "Windows": "windows",
            "macOS": "macos",
          }.get(runner_os, "")
          if not os_key:
            raise RuntimeError(f"unsupported RUNNER_OS={runner_os}")

          repo_root = pathlib.Path(".").resolve()
          resources_root = repo_root / "src-tauri" / "resources"
          whisper_server_dir = resources_root / "whisper-server"
          whisper_models_dir = resources_root / "whisper"
          temp_root = repo_root / ".tmp-whisper-runtime"
          shutil.rmtree(temp_root, ignore_errors=True)
          temp_root.mkdir(parents=True, exist_ok=True)
          whisper_server_dir.mkdir(parents=True, exist_ok=True)
          whisper_models_dir.mkdir(parents=True, exist_ok=True)

          # === Download Whisper Model ===
          # Download quantized model from HuggingFace
          print("[whisper-runtime] Downloading model files...")
          model_files = [
            ("ggml-base.en-q8_0.bin", "https://huggingface.co/datasets/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q8_0.bin"),
            ("ggml-tiny.en-q8_0.bin", "https://huggingface.co/datasets/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q8_0.bin"),
          ]

          for model_name, model_url in model_files:
            model_path = whisper_models_dir / model_name
            if model_path.exists():
              print(f"[whisper-runtime] Model already exists: {model_name}")
            else:
              print(f"[whisper-runtime] Downloading {model_name}...")
              if download_file(model_url, model_path):
                print(f"[whisper-runtime] Downloaded: {model_name}")
              else:
                print(f"[whisper-runtime] Warning: Failed to download {model_name}")

          # === Download Whisper Server Binary ===
          # Fetch whisper.cpp releases
          release = request_json("https://api.github.com/repos/ggerganov/whisper.cpp/releases/latest")
          assets = release.get("assets", [])
          tag = release.get("tag_name", "unknown")

          print(f"[whisper-runtime] Fetched release {tag} with {len(assets)} assets")

          # Map OS to binary patterns
          binary_patterns = {
            "linux": ["whisper-server-linux-x86_64"],
            "windows": ["whisper-server-windows-x86_64.exe"],
            "macos": ["whisper-server-macos-arm64", "whisper-server-macos-aarch64", "whisper-server-macos-x86_64"],
          }

          found_binary = None
          for asset in assets:
            name = asset.get("name", "").lower()
            # Skip source code archives
            if "source" in name:
              continue
            for pattern in binary_patterns.get(os_key, []):
              # Look for server binary in archive name
              if pattern in name and (name.endswith(".zip") or name.endswith(".tar.gz") or name.endswith(".tar.xz")):
                found_binary = asset
                break
            if found_binary:
                break

          # Alternative: look for any server binary
          if not found_binary:
            for asset in assets:
              name = asset.get("name", "").lower()
              if "whisper-server" in name and not "source" in name and (name.endswith(".zip") or name.endswith(".tar.gz") or name.endswith(".tar.xz")):
                found_binary = asset
                break

          if not found_binary:
            print("[whisper-runtime] No pre-built server binary found in release")
            print("[whisper-runtime] Note: whisper.cpp may require building from source")
            # Create a manifest noting that binary wasn't found
            manifest = {
              "releaseTag": tag,
              "runnerOs": runner_os,
              "status": "binary_not_found",
              "note": "Pre-built whisper-server binary not found. Build from source: git clone https://github.com/ggerganov/whisper.cpp && cd whisper.cpp && make server",
            }
            (whisper_server_dir / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
            print("[whisper-runtime] manifest written (binary not found)")
          else:
            name = found_binary["name"]
            url = found_binary["browser_download_url"]
            print(f"[whisper-runtime] Downloading: {name}")

            archive_path = temp_root / name
            req = urllib.request.Request(url, headers={"User-Agent": "arxell-ci"})
            with urllib.request.urlopen(req, timeout=120) as resp, open(archive_path, "wb") as out:
              shutil.copyfileobj(resp, out)

            extract_dir = temp_root / "extract"
            extract_dir.mkdir(parents=True, exist_ok=True)

            # Determine extension and extract
            if name.endswith(".zip"):
              with zipfile.ZipFile(archive_path) as zf:
                zf.extractall(extract_dir)
            else:
              safe_extract_tar(archive_path, extract_dir)

            # Find the binary
            binary_map = {
              "linux": "whisper-server-linux-x86_64",
              "macos": "whisper-server-macos-aarch64",
              "windows": "whisper-server-windows-x86_64.exe",
            }
            target_binary = binary_map.get(os_key, "whisper-server")

            for path in extract_dir.rglob("whisper-server*"):
              if path.is_file():
                binary_dest = whisper_server_dir / target_binary
                shutil.copy2(path, binary_dest)
                if os_key != "windows":
                  binary_dest.chmod(binary_dest.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
                print(f"[whisper-runtime] Prepared: {binary_dest}")
                manifest = {
                  "releaseTag": tag,
                  "runnerOs": runner_os,
                  "status": "ready",
                  "binaryPath": str(binary_dest.relative_to(repo_root)),
                }
                (whisper_server_dir / "manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
                print("[whisper-runtime] manifest written")
                break

          # List final files
          print("[whisper-runtime] Final resources:")
          for p in whisper_server_dir.iterdir():
            print(f"  {p.name}")
          for p in whisper_models_dir.iterdir():
            print(f"  {p.name}")
          PY

      - name: Prepare bundled Kokoro runtime archive
        if: steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "Python executable not found on runner" >&2
            exit 1
          fi
          "$PY" scripts/prepare_kokoro_runtime.py

      - name: Verify bundled Kokoro runtime archive
        if: steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "Python executable not found on runner" >&2
            exit 1
          fi
          "$PY" scripts/verify_kokoro_runtime_archive.py

      - name: Generate Kokoro runtime manifest
        if: steps.cache_runtimes.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "Python executable not found on runner" >&2
            exit 1
          fi
          "$PY" - <<'PY'
          import hashlib
          import json
          import pathlib
          import platform

          def expected_archive_name() -> str:
            system = platform.system().lower()
            machine = platform.machine().lower()
            if machine in {"amd64", "x86_64", "x64"}:
              arch = "x86_64"
            elif machine in {"arm64", "aarch64"}:
              arch = "aarch64"
            else:
              raise RuntimeError(f"Unsupported architecture: {machine}")

            if system == "linux":
              os_tag = "linux"
            elif system == "darwin":
              os_tag = "macos"
            elif system == "windows":
              os_tag = "windows"
            else:
              raise RuntimeError(f"Unsupported platform: {system}")
            return f"kokoro-runtime-{os_tag}-{arch}.zip"

          repo_root = pathlib.Path(".").resolve()
          runtime_dir = repo_root / "src-tauri" / "resources" / "kokoro-runtime"
          archive = runtime_dir / expected_archive_name()
          if not archive.exists():
            raise RuntimeError(f"Kokoro runtime archive missing: {archive}")

          sha256 = hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest = {
            "runnerOs": platform.system(),
            "runnerArch": platform.machine(),
            "archiveName": archive.name,
            "archivePath": str(archive.relative_to(repo_root)),
            "archiveSizeBytes": archive.stat().st_size,
            "sha256": sha256,
          }
          (runtime_dir / "manifest.json").write_text(
            json.dumps(manifest, indent=2) + "\n",
            encoding="utf-8",
          )
          print(f"[kokoro-runtime] manifest written for {archive.name}")
          PY

      - name: Build Tauri app bundle
        working-directory: src-tauri
        shell: bash
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          set -euo pipefail
          mkdir -p "${XDG_CACHE_HOME}"
          rm -rf target/release/bundle
          case "${{ matrix.platform.os }}" in
            ubuntu-24.04)
              cargo tauri build --bundles deb -- --features tauri-runtime 2>&1
              LD_LIBRARY_PATH="" cargo tauri build --bundles appimage -- --features tauri-runtime 2>&1
              ;;
            windows-latest)
              cargo tauri build --bundles msi -- --features tauri-runtime
              ;;
            macos-latest)
              cargo tauri build --bundles dmg -- --features tauri-runtime
              ;;
            *)
              echo "Unsupported platform: ${{ matrix.platform.os }}" >&2
              exit 1
              ;;
          esac

      - name: Verify Linux artifacts
        if: matrix.platform.os == 'ubuntu-24.04'
        run: |
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)

          [ -f "$DEB" ]      || { echo "ERROR: .deb not found";      exit 1; }
          [ -f "$APPIMAGE" ] || { echo "ERROR: .AppImage not found"; exit 1; }

          echo "deb:      $(du -h "$DEB"      | cut -f1)  $DEB"
          echo "AppImage: $(du -h "$APPIMAGE" | cut -f1)  $APPIMAGE"

          find src-tauri/target/release/bundle/appimage \
            -type d -name "*.AppDir" -exec rm -rf {} + 2>/dev/null || true

          SIZE=$(stat -c%s "$APPIMAGE")
          [ "$SIZE" -gt 10485760 ] || { echo "ERROR: AppImage is ${SIZE} bytes — likely a partial build"; exit 1; }

      - name: Verify Tauri bundle output
        shell: bash
        env:
          PLATFORM_OS: ${{ matrix.platform.os }}
        run: |
          set -euo pipefail
          test -d src-tauri/target/release/bundle
          python - <<'PY'
          import os
          import pathlib

          platform_os = os.environ["PLATFORM_OS"]
          expected_suffixes = {
              "ubuntu-24.04": {".deb", ".appimage"},
              "windows-latest": {".msi"},
              "macos-latest": {".dmg"},
          }.get(platform_os)
          if expected_suffixes is None:
              raise SystemExit(f"Unsupported platform: {platform_os}")

          files = [p for p in pathlib.Path("src-tauri/target/release/bundle").rglob("*") if p.is_file()]
          package_files = [p for p in files if p.suffix.lower() in expected_suffixes]
          if not package_files:
            raise SystemExit("No final Tauri package files were produced")
          for path in package_files:
            print(f"{path} ({path.stat().st_size} bytes)")

          produced_suffixes = {p.suffix.lower() for p in package_files}
          missing_suffixes = expected_suffixes - produced_suffixes
          if missing_suffixes:
              raise SystemExit(
                  f"Missing required bundle output for {platform_os}: "
                  f"{sorted(missing_suffixes)}"
              )
          PY

      - name: Upload Tauri bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-tauri-bundle
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

      - name: Upload bundled runtime manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-llama-runtime-manifest
          path: src-tauri/resources/llama-runtime/manifest.json
          if-no-files-found: error

      - name: Upload bundled whisper manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-whisper-runtime-manifest
          path: src-tauri/resources/whisper-server/manifest.json
          if-no-files-found: warn

      - name: Upload bundled Kokoro runtime manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-kokoro-runtime-manifest
          path: src-tauri/resources/kokoro-runtime/manifest.json
          if-no-files-found: error

      - name: Upload bundled Kokoro runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-kokoro-runtime
          path: src-tauri/resources/kokoro-runtime/kokoro-runtime-*.zip
          if-no-files-found: error

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}-v${{ steps.app_version.outputs.version }}-release-assets
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          fi
          version="$("$PY" -c 'import pathlib,re,sys; text=pathlib.Path("src-tauri/Cargo.toml").read_text(encoding="utf-8"); section=re.search(r"(?ms)^\[package\]\s*(.*?)(?=^\[|\Z)", text); m=re.search(r"(?m)^\s*version\s*=\s*\"([^\"]+)\"\s*$", section.group(1) if section else ""); print(m.group(1) if m else (sys.stderr.write("Could not find [package].version in src-tauri/Cargo.toml\\n") or sys.exit(1)))')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Download release bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release-assets"
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          files: |
            release-assets/**/*.deb
            release-assets/**/*.AppImage
            release-assets/**/*.dmg
            release-assets/**/*.msi
          fail_on_unmatched_files: true
          generate_release_notes: true
